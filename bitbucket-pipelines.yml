image: docker:git

pipelines:
  default:
     - step:
         name: "Check cppcheck"
         script:
           - apk add --update bash coreutils tar cppcheck
           - cppcheck src/*
     - step:
         name: "Check cpplint"
         script:
           - apk add --update bash coreutils tar python3 py3-pip
           - pip3 install cpplint
           - cpplint --filter=-whitespace/braces,-legal/copyright --recursive src/*
     - step:
         name: "ROS Build"
         services:
           - docker
         script:
           - apk add --update bash coreutils tar
           - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci -b master
           - .industrial_ci/bitbucket.sh ROS_DISTRO="melodic"

definitions:
  services:
    docker:
      memory: 2048
